<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario - Plataforma ICC</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <base target="_self">
</head>
<body class="bg-gradient-to-br from-slate-950 via-[#2A000D] to-slate-950 text-slate-100 font-sans antialiased min-h-screen flex flex-col justify-between selection:bg-[#7A0026] selection:text-white">

<div class="relative min-h-screen flex flex-col justify-between overflow-hidden">

    <!-- Destellos/Glows Decorativos de Fondo -->
    <div class="absolute -top-24 -left-24 w-96 h-96 bg-[#7A0026]/30 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-24 -right-24 w-96 h-96 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <!-- CONTENEDOR PRINCIPAL -->
    <main class="relative z-10 my-auto px-4 sm:px-6 lg:px-8 py-10 w-full max-w-5xl mx-auto">

        <!-- Tarjeta Principal con Glassmorphism en Tono Vino/Guinda -->
        <div class="w-full bg-[#18030A]/80 backdrop-blur-xl rounded-3xl border border-white/20 shadow-[0_0_50px_rgba(122,0,38,0.25)] p-5 sm:p-8">

            <!-- Encabezado del Formulario -->
            <div class="flex items-center justify-between gap-4 mb-6 border-b border-white/10 pb-5">
                <div class="flex items-center gap-3.5">
                    <div class="p-3 bg-gradient-to-br from-[#7A0026] to-[#4A0017] text-amber-300 rounded-2xl border border-amber-400/30 shadow-lg shadow-[#7A0026]/40">
                        <i data-lucide="calendar" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <h1 class="text-xl sm:text-2xl font-black text-white tracking-wide">Calendario de Actividades</h1>
                        <p class="text-xs sm:text-sm text-rose-200/70 font-medium">Consulta los eventos y actividades programadas en el territorio.</p>
                    </div>
                </div>

                <!-- Botón para regresar al inicio -->
                <a href="index.html" target="_self" class="px-4 py-2 rounded-full bg-black/40 backdrop-blur-md border border-white/80 hover:bg-white/10 text-white text-xs font-semibold transition flex items-center gap-2 shadow-md">
                    <i data-lucide="arrow-left" class="w-4 h-4 text-amber-300"></i>
                    Volver
                </a>
            </div>

            <!-- CONTENEDOR DEL CALENDARIO -->
            <div class="relative w-full overflow-hidden rounded-2xl bg-white/95 border border-white/30 shadow-inner h-[550px] sm:h-[650px]">
                <iframe
                        id="gcal-frame"
                        src="https://calendar.google.com/calendar/embed?src=57281d9c5038cabd04862cf7141c272c64aa342ec26f8f1cae50c3aa9e53d224%40group.calendar.google.com&ctz=America%2FMazatlan"
                        class="w-full h-full absolute inset-0 border-0"
                        frameborder="0"
                        scrolling="no">
                </iframe>
            </div>

        </div>

    </main>

</div>

<script>
    // Inicializar íconos
    lucide.createIcons();

    // Asegurar que las interacciones permanezcan en la misma pestaña
    document.addEventListener("DOMContentLoaded", function() {
        const links = document.querySelectorAll("a");
        links.forEach(link => link.setAttribute("target", "_self"));
    });
</script>

</body>
</html>
